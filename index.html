<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>还没死 - 存在确认与状态同步</title>
    <style>
        /* ========== 基础重置 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            color: #2d3436;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            animation: gradientShift 15s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ========== 主容器 ========== */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        /* ========== 头部样式 ========== */
        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, #e17055 0%, #d63031 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-block;
            position: relative;
        }

        .subtitle {
            font-size: 1rem;
            color: #636e72;
            margin-top: 0.5rem;
            letter-spacing: 0.2em;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== 视图切换 ========== */
        .view {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .view.active {
            display: block;
        }

        /* ========== 认证表单 ========== */
        .auth-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            font-size: 1rem;
            padding: 0.5rem 1.5rem;
            color: #636e72;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: #e17055;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #e17055;
        }

        .tab-btn.active::after {
            width: 80%;
        }

        .auth-form {
            background: #ffffff;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        .input-group input,
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid transparent;
            border-radius: 16px;
            font-size: 1rem;
            background: #f8f9fa;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            background: #ffffff;
            border-color: #e17055;
            box-shadow: 0 0 0 4px rgba(225, 112, 85, 0.1);
        }

        .captcha-group {
            display: flex;
            gap: 0.75rem;
        }

        .captcha-group input {
            flex: 1;
        }

        /* ========== 按钮样式 ========== */
        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn.primary {
            background: linear-gradient(135deg, #e17055 0%, #d63031 100%);
            color: #ffffff;
            width: 100%;
            box-shadow: 0 4px 15px rgba(225, 112, 85, 0.3);
        }

        .btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(225, 112, 85, 0.4);
        }

        .btn.secondary {
            background: #ffffff;
            color: #2d3436;
            border: 2px solid #eee;
        }

        .btn.secondary:hover {
            border-color: #e17055;
            color: #e17055;
        }

        .btn.large {
            padding: 1.5rem 3rem;
            font-size: 1.25rem;
            border-radius: 24px;
            background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
            color: #ffffff;
            box-shadow: 0 8px 30px rgba(0, 184, 148, 0.3);
            animation: breathe 3s ease-in-out infinite;
        }

        .btn.large:hover {
            animation: none;
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(0, 184, 148, 0.4);
        }

        .btn.small {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            background: #e17055;
            color: #ffffff;
            border-radius: 8px;
        }

        .btn.text-only {
            background: transparent;
            color: #b2bec3;
            padding: 1rem;
            margin-top: 2rem;
        }

        /* ========== 用户卡片 ========== */
        .user-card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.6s ease 0.2s both;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fdcb6e 0%, #f39c12 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
            color: #ffffff;
            font-weight: 700;
        }

        .user-card h2 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #e17055;
            line-height: 1;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #636e72;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* ========== 区域样式 ========== */
        .section {
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 1rem;
            animation: fadeIn 0.6s ease both;
        }

        .section:nth-of-type(1) { animation-delay: 0.1s; }
        .section:nth-of-type(2) { animation-delay: 0.2s; }
        .section:nth-of-type(3) { animation-delay: 0.3s; }

        .section-title {
            font-size: 1rem;
            color: #636e72;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #eee;
        }

        .checkin-status {
            text-align: center;
        }

        #checkin-message {
            font-size: 1.125rem;
            color: #636e72;
            margin-bottom: 1.5rem;
        }

        #checkin-message.checked {
            color: #00b894;
        }

        /* ========== 状态选择 ========== */
        .status-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .status-option {
            cursor: pointer;
        }

        .status-option input {
            display: none;
        }

        .status-badge {
            display: block;
            padding: 0.75rem 1rem;
            border-radius: 16px;
            text-align: center;
            font-size: 0.875rem;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .status-badge.great {
            background: rgba(0, 184, 148, 0.1);
            color: #00b894;
        }

        .status-badge.ok {
            background: rgba(253, 203, 110, 0.2);
            color: #f39c12;
        }

        .status-badge.tired {
            background: rgba(225, 112, 85, 0.1);
            color: #e17055;
        }

        .status-badge.dead {
            background: rgba(214, 48, 49, 0.1);
            color: #d63031;
        }

        .status-option input:checked + .status-badge {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .status-option input:checked + .status-badge.great {
            border-color: #00b894;
            background: rgba(0, 184, 148, 0.2);
        }

        .status-option input:checked + .status-badge.ok {
            border-color: #f39c12;
            background: rgba(253, 203, 110, 0.3);
        }

        .status-option input:checked + .status-badge.tired {
            border-color: #e17055;
            background: rgba(225, 112, 85, 0.2);
        }

        .status-option input:checked + .status-badge.dead {
            border-color: #d63031;
            background: rgba(214, 48, 49, 0.2);
        }

        /* ========== 模态框 ========== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
            animation: fadeIn 0.3s ease;
        }

        .modal.hidden {
            display: none !important;
        }

        .modal-content {
            background: #ffffff;
            padding: 2rem;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.4s ease;
        }

        .modal-content h3 {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .modal-actions .btn {
            flex: 1;
        }

        /* ========== 历史记录 ========== */
        .chart-container {
            height: 120px;
            margin-bottom: 1rem;
        }

        .chart-container canvas {
            width: 100%;
            height: 100%;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .history-date {
            color: #636e72;
        }

        .history-comment {
            color: #b2bec3;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }

        /* ========== 亲友列表 ========== */
        .contacts-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .contact-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .contact-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fdcb6e 0%, #f39c12 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 0.875rem;
        }

        /* ========== Toast 提示 ========== */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #2d3436;
            color: #ffffff;
            padding: 1rem 2rem;
            border-radius: 16px;
            font-size: 0.875rem;
            z-index: 2000;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: #00b894;
        }

        .toast.error {
            background: #d63031;
        }

        /* ========== 响应式设计 ========== */
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem 1rem;
            }

            .title {
                font-size: 2.5rem;
            }

            .auth-form {
                padding: 1.5rem;
            }

            .stats {
                gap: 2rem;
            }

            .status-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1 class="title">还没死</h1>
            <p class="subtitle">每一天，都是胜利</p>
        </header>

        <!-- 认证视图 -->
        <div id="auth-view" class="view active">
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">登录</button>
                <button class="tab-btn" data-tab="register">注册</button>
            </div>

            <!-- 登录表单 -->
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <input type="text" id="login-identifier" placeholder="邮箱或手机号" required>
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" placeholder="密码" required>
                </div>
                <button type="submit" class="btn primary">进入</button>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" class="auth-form hidden">
                <div class="input-group">
                    <input type="text" id="reg-username" placeholder="用户名" required>
                </div>
                <div class="input-group">
                    <input type="email" id="reg-email" placeholder="邮箱（可选）">
                </div>
                <div class="input-group">
                    <input type="tel" id="reg-phone" placeholder="手机号（可选）">
                </div>
                <div class="input-group captcha-group">
                    <input type="text" id="reg-captcha" placeholder="验证码" required>
                    <button type="button" id="send-captcha" class="btn small">获取</button>
                </div>
                <div class="input-group">
                    <input type="password" id="reg-password" placeholder="设置密码" required>
                </div>
                <button type="submit" class="btn primary">注册</button>
            </form>
        </div>

        <!-- 主视图 -->
        <div id="main-view" class="view">
            <!-- 用户卡片 -->
            <div class="user-card">
                <div class="avatar">
                    <span id="user-initial">U</span>
                </div>
                <h2 id="welcome-text">欢迎，旅行者</h2>
                <div class="stats">
                    <div class="stat-item">
                        <span class="stat-value" id="consecutive-days">0</span>
                        <span class="stat-label">连续存活</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="total-days">0</span>
                        <span class="stat-label">总天数</span>
                    </div>
                </div>
            </div>

            <!-- 签到区域 -->
            <div class="section">
                <div class="checkin-status">
                    <p id="checkin-message">今日尚未签到</p>
                    <button id="checkin-btn" class="btn large">我还活着</button>
                </div>
            </div>

            <!-- 历史记录 -->
            <div class="section">
                <h3 class="section-title">最近 7 天</h3>
                <div class="chart-container">
                    <canvas id="trend-canvas"></canvas>
                </div>
                <div id="history-list" class="history-list"></div>
            </div>

            <!-- 亲友管理 -->
            <div class="section">
                <h3 class="section-title">我的亲友</h3>
                <div id="contacts-list" class="contacts-list"></div>
                <button id="add-contact-btn" class="btn secondary" style="width: 100%;">添加亲友</button>
            </div>

            <button id="logout-btn" class="btn text-only">退出登录</button>
        </div>
    </div>

    <!-- 签到弹窗 -->
    <div id="checkin-modal" class="modal hidden">
        <div class="modal-content">
            <h3>今天感觉如何？</h3>
            <div class="status-options">
                <label class="status-option">
                    <input type="radio" name="status" value="特别好">
                    <span class="status-badge great">特别好 ✨</span>
                </label>
                <label class="status-option">
                    <input type="radio" name="status" value="马马虎虎">
                    <span class="status-badge ok">马马虎虎 😐</span>
                </label>
                <label class="status-option">
                    <input type="radio" name="status" value="累死个屁的">
                    <span class="status-badge tired">累死个屁的 😵</span>
                </label>
                <label class="status-option">
                    <input type="radio" name="status" value="速来烧纸">
                    <span class="status-badge dead">速来烧纸 🕯️</span>
                </label>
            </div>
            <div class="input-group">
                <textarea id="checkin-comment" placeholder="想对亲友说的话..." rows="3"></textarea>
            </div>
            <div class="modal-actions">
                <button id="cancel-checkin" class="btn secondary">再想想</button>
                <button id="confirm-checkin" class="btn primary">确认签到</button>
            </div>
        </div>
    </div>

    <!-- 添加亲友弹窗 -->
    <div id="contact-modal" class="modal hidden">
        <div class="modal-content">
            <h3>添加亲友</h3>
            <div class="input-group">
                <select id="contact-type" style="width: 100%; padding: 1rem 1.25rem; border: 2px solid transparent; border-radius: 16px; font-size: 1rem; background: #f8f9fa; outline: none;">
                    <option value="email">邮箱</option>
                    <option value="phone">手机号</option>
                </select>
            </div>
            <div class="input-group">
                <input type="text" id="contact-value" placeholder="输入联系方式">
            </div>
            <div class="modal-actions">
                <button id="cancel-contact" class="btn secondary">取消</button>
                <button id="confirm-contact" class="btn primary">添加</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        // ========== 《还没死》前端应用 ==========
        class NotDeadApp {
            constructor() {
                this.currentUser = null;
                this.checkinHistory = [];
                this.isLoggedIn = false;
                this.init();
            }

            init() {
                this.bindEvents();
                this.checkLoginStatus();
            }

            bindEvents() {
                // 标签切换
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => this.switchTab(e.target.dataset.tab));
                });

                // 登录
                document.getElementById('login-form').addEventListener('submit', (e) => this.handleLogin(e));

                // 注册
                document.getElementById('register-form').addEventListener('submit', (e) => this.handleRegister(e));

                // 验证码
                document.getElementById('send-captcha').addEventListener('click', () => this.sendCaptcha());

                // 签到按钮
                document.getElementById('checkin-btn').addEventListener('click', () => this.openCheckinModal());

                // 取消签到
                document.getElementById('cancel-checkin').addEventListener('click', () => this.closeModal('checkin-modal'));

                // 确认签到
                document.getElementById('confirm-checkin').addEventListener('click', () => this.submitCheckin());

                // 添加亲友
                document.getElementById('add-contact-btn').addEventListener('click', () => this.openModal('contact-modal'));

                // 取消添加亲友
                document.getElementById('cancel-contact').addEventListener('click', () => this.closeModal('contact-modal'));

                // 确认添加亲友
                document.getElementById('confirm-contact').addEventListener('click', () => this.addContact());

                // 退出登录
                document.getElementById('logout-btn').addEventListener('click', () => this.logout());
            }

            switchTab(tab) {
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === tab);
                });
                document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
                document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
            }

            checkLoginStatus() {
                // 模拟已登录状态，直接显示主界面
                // 在实际应用中，这里会检查 localStorage 或发送请求验证
                const savedUser = localStorage.getItem('notdead_user');
                if (savedUser) {
                    this.currentUser = JSON.parse(savedUser);
                    this.isLoggedIn = true;
                    this.showMainView();
                } else {
                    this.showAuthView();
                }
            }

            showAuthView() {
                document.getElementById('auth-view').classList.add('active');
                document.getElementById('main-view').classList.remove('active');
            }

            showMainView() {
                document.getElementById('auth-view').classList.remove('active');
                document.getElementById('main-view').classList.add('active');
                this.loadUserData();
            }

            handleLogin(e) {
                e.preventDefault();
                const identifier = document.getElementById('login-identifier').value;
                const password = document.getElementById('login-password').value;

                if (!identifier || !password) {
                    this.showToast('请填写完整信息', 'error');
                    return;
                }

                // 模拟登录
                this.currentUser = {
                    id: 1,
                    username: identifier,
                    consecutive_days: Math.floor(Math.random() * 30),
                    total_days: Math.floor(Math.random() * 100),
                    last_checkin: null
                };

                localStorage.setItem('notdead_user', JSON.stringify(this.currentUser));
                this.isLoggedIn = true;
                this.showMainView();
                this.showToast('登录成功', 'success');
            }

            handleRegister(e) {
                e.preventDefault();
                const username = document.getElementById('reg-username').value;
                const email = document.getElementById('reg-email').value;
                const phone = document.getElementById('reg-phone').value;
                const password = document.getElementById('reg-password').value;

                if (!username || !password) {
                    this.showToast('用户名和密码不能为空', 'error');
                    return;
                }

                if (!email && !phone) {
                    this.showToast('请填写邮箱或手机号', 'error');
                    return;
                }

                // 模拟注册成功
                this.showToast('注册成功，请登录', 'success');
                this.switchTab('login');
                e.target.reset();
            }

            sendCaptcha() {
                const phone = document.getElementById('reg-phone').value;
                const email = document.getElementById('reg-email').value;
                const contact = phone || email;

                if (!contact) {
                    this.showToast('请先填写邮箱或手机号', 'error');
                    return;
                }

                const btn = document.getElementById('send-captcha');
                btn.disabled = true;
                let countdown = 60;
                btn.textContent = `${countdown}s`;

                const timer = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        btn.textContent = `${countdown}s`;
                    } else {
                        clearInterval(timer);
                        btn.disabled = false;
                        btn.textContent = '获取';
                    }
                }, 1000);

                this.showToast('验证码已发送: 666666', 'success');
            }

            loadUserData() {
                if (!this.currentUser) return;

                // 更新用户卡片
                document.getElementById('user-initial').textContent = this.currentUser.username.charAt(0).toUpperCase();
                document.getElementById('welcome-text').textContent = `欢迎，${this.currentUser.username}`;
                document.getElementById('consecutive-days').textContent = this.currentUser.consecutive_days || 0;
                document.getElementById('total-days').textContent = this.currentUser.total_days || 0;

                // 检查今日签到状态
                const today = new Date().toDateString();
                const lastCheckin = this.currentUser.last_checkin ? new Date(this.currentUser.last_checkin).toDateString() : null;

                const checkinBtn = document.getElementById('checkin-btn');
                const message = document.getElementById('checkin-message');

                if (lastCheckin === today) {
                    checkinBtn.classList.add('hidden');
                    message.textContent = '今日已签到，明天再来吧 💪';
                    message.classList.add('checked');
                } else {
                    checkinBtn.classList.remove('hidden');
                    message.textContent = '今日尚未签到';
                    message.classList.remove('checked');
                }

                // 渲染历史记录
                this.renderHistory();

                // 渲染趋势图
                this.renderTrendChart();

                // 渲染亲友列表
                this.renderContacts();
            }

            renderHistory() {
                const list = document.getElementById('history-list');
                const statusLabels = {
                    '特别好': '特别好 ✨',
                    '马马虎虎': '马马虎虎 😐',
                    '累死个屁的': '累成狗 😵',
                    '速来烧纸': '需要关心 🕯️'
                };

                // 模拟历史数据
                const mockHistory = [
                    { status: '马马虎虎', comment: '又是普通的一天', date: new Date(Date.now() - 86400000) },
                    { status: '特别好', comment: '周末快乐!', date: new Date(Date.now() - 172800000) },
                    { status: '累死个屁的', comment: '加班到很晚', date: new Date(Date.now() - 259200000) },
                    { status: '特别好', comment: '项目完成了', date: new Date(Date.now() - 345600000) },
                ];

                if (mockHistory.length === 0) {
                    list.innerHTML = '<div class="history-item"><span class="history-date">暂无记录</span></div>';
                    return;
                }

                list.innerHTML = mockHistory.map(item => {
                    const formattedDate = `${item.date.getMonth() + 1}/${item.date.getDate()}`;
                    return `
                        <div class="history-item">
                            <span class="history-date">${formattedDate}</span>
                            <span>${statusLabels[item.status] || item.status}</span>
                            ${item.comment ? `<span class="history-comment">"${item.comment}"</span>` : ''}
                        </div>
                    `;
                }).join('');
            }

            renderTrendChart() {
                const canvas = document.getElementById('trend-canvas');
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                const container = canvas.parentElement;
                
                const rect = container.getBoundingClientRect();
                canvas.width = rect.width * 2;
                canvas.height = rect.height * 2;
                ctx.scale(2, 2);

                const width = rect.width;
                const height = rect.height;
                const padding = 20;
                const chartWidth = width - padding * 2;
                const chartHeight = height - padding * 2;

                ctx.clearRect(0, 0, width, height);

                // 绘制网格线
                ctx.strokeStyle = '#f0f0f0';
                ctx.lineWidth = 1;
                for (let i = 0; i <= 4; i++) {
                    const y = padding + (chartHeight / 4) * i;
                    ctx.beginPath();
                    ctx.moveTo(padding, y);
                    ctx.lineTo(width - padding, y);
                    ctx.stroke();
                }

                // 模拟数据点
                const dataPoints = [3, 4, 2, 4, 3, 4, 3];
                const xStep = chartWidth / 6;

                ctx.strokeStyle = '#e17055';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                dataPoints.forEach((value, index) => {
                    const x = padding + xStep * index;
                    const y = padding + chartHeight - (value / 4) * chartHeight;
                    if (index === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();

                // 绘制数据点
                dataPoints.forEach((value, index) => {
                    const x = padding + xStep * index;
                    const y = padding + chartHeight - (value / 4) * chartHeight;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#e17055';
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(x, y, 6, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(225, 112, 85, 0.2)';
                    ctx.fill();
                });

                // 日期标签
                ctx.fillStyle = '#b2bec3';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                for (let i = 6; i >= 0; i--) {
                    const date = new Date();
                    date.setDate(date.getDate() - i);
                    const x = padding + (chartWidth / 6) * (6 - i);
                    ctx.fillText(`${date.getMonth() + 1}/${date.getDate()}`, x, height - 5);
                }
            }

            renderContacts() {
                const list = document.getElementById('contacts-list');
                const mockContacts = [
                    { type: 'email', value: 'mom@example.com' },
                    { type: 'phone', value: '138****8888' }
                ];

                if (mockContacts.length === 0) {
                    list.innerHTML = '<div class="contact-item"><span style="color: #b2bec3;">还没有添加亲友</span></div>';
                    return;
                }

                list.innerHTML = mockContacts.map((contact, index) => `
                    <div class="contact-item">
                        <div class="contact-info">
                            <div class="contact-icon">${contact.type === 'email' ? '✉' : '📱'}</div>
                            <span>${contact.value}</span>
                        </div>
                        <button class="contact-delete" onclick="app.removeContact(${index})">✕</button>
                    </div>
                `).join('');
            }

            openCheckinModal() {
                document.getElementById('checkin-modal').classList.remove('hidden');
                document.querySelector('input[name="status"]').checked = true;
                document.getElementById('checkin-comment').value = '';
            }

            closeModal(modalId) {
                document.getElementById(modalId).classList.add('hidden');
            }

            openModal(modalId) {
                document.getElementById(modalId).classList.remove('hidden');
            }

            submitCheckin() {
                const status = document.querySelector('input[name="status"]:checked')?.value;
                const comment = document.getElementById('checkin-comment').value.trim();

                if (!status) {
                    this.showToast('请选择今天的状态', 'error');
                    return;
                }

                // 模拟签到成功
                this.currentUser.last_checkin = new Date().toISOString();
                this.currentUser.consecutive_days = (this.currentUser.consecutive_days || 0) + 1;
                this.currentUser.total_days = (this.currentUser.total_days || 0) + 1;
                localStorage.setItem('notdead_user', JSON.stringify(this.currentUser));

                this.closeModal('checkin-modal');
                this.loadUserData();
                this.showToast('签到成功！还活着真好 ✨', 'success');
            }

            addContact() {
                const type = document.getElementById('contact-type').value;
                const value = document.getElementById('contact-value').value.trim();

                if (!value) {
                    this.showToast('请输入联系方式', 'error');
                    return;
                }

                this.closeModal('contact-modal');
                this.showToast('添加成功', 'success');
                this.renderContacts();
            }

            removeContact(index) {
                if (confirm('确定要删除这位亲友吗？')) {
                    this.showToast('已删除', 'success');
                    this.renderContacts();
                }
            }

            logout() {
                localStorage.removeItem('notdead_user');
                this.currentUser = null;
                this.isLoggedIn = false;
                this.showAuthView();
                this.showToast('已退出登录', 'success');
            }

            showToast(message, type = '') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast show ${type}`;

                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        }

        // 初始化应用
        const app = new NotDeadApp();
    </script>
</body>
</html>
